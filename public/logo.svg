<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 240 64"
  width="240"
  height="64"
>
  <!-- Fundo opcional -->
  <rect width="240" height="64" fill="transparent"/>

  <!-- Círculo de fundo suave -->
  <circle cx="48" cy="32" r="30" fill="rgba(76, 175, 80, 0.08)"/>

  <!-- Tronco central -->
  <rect x="42" y="28" width="4" height="16" fill="#4CAF50" rx="2"/>

  <!-- Galhos / membros -->
  <circle cx="24" cy="16" r="6" fill="#81C784"/>
  <circle cx="72" cy="16" r="6" fill="#81C784"/>
  <circle cx="24" cy="48" r="6" fill="#81C784"/> 
  <circle cx="72" cy="48" r="6" fill="#81C784"/>

  <!-- Conexões -->
  <line x1="44" y1="28" x2="24" y2="16" stroke="#4CAF50" stroke-width="2"/>
  <line x1="44" y1="28" x2="72" y2="16" stroke="#4CAF50" stroke-width="2"/>
  <line x1="44" y1="28" x2="24" y2="48" stroke="#4CAF50" stroke-width="2"/>
  <line x1="44" y1="28" x2="72" y2="48" stroke="#4CAF50" stroke-width="2"/>

  <!-- Texto do projeto -->
  <text
    x="100"
    y="40"
    font-family="Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="28"
    fill="#333"
  >
    Family
  </text>
</svg>
